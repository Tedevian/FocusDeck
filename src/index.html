<!DOCTYPE html>
<!-- Define el tipo de documento como HTML5 -->
<html lang="en">
<!-- Comienza el documento HTML en idioma español -->

<head>
  <meta charset="UTF-8" />
  <!-- Establece la codificación de caracteres en UTF-8 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FocusDeck</title>
  <!-- Título de la pestaña del navegador o ventana de la app -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Orbitron:wght@500;600;700;800;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />
  <!-- Fuentes: Manrope (cuerpo), Orbitron (display/neón) y Share Tech Mono (dígitos) -->

  <link rel="stylesheet" href="index.css" />
  <!-- Enlaza la hoja de estilos CSS externa -->
</head>

<body>
  <div id="titlebar">
    <!-- Barra de título custom (reemplaza el marco y menú de Electron) -->
    <div class="titlebar-brand">
      <span class="titlebar-logo" aria-hidden="true">◮</span>
      <span class="titlebar-title">FocusDeck</span>
    </div>

    <div class="titlebar-controls">
      <!-- Controles de ventana: minimizar / maximizar-restaurar / cerrar -->
      <button id="winMinimize" class="win-btn" aria-label="Minimize" title="Minimize">
        <svg viewBox="0 0 12 12" aria-hidden="true">
          <line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>

      <button id="winMaximize" class="win-btn" aria-label="Maximize" title="Maximize">
        <svg id="winMaxIcon" viewBox="0 0 12 12" aria-hidden="true">
          <rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.5" />
        </svg>
        <svg id="winRestoreIcon" viewBox="0 0 12 12" style="display: none" aria-hidden="true">
          <rect x="2.5" y="4" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.5" />
          <path d="M4.5 4 V2.5 H9.5 V7.5 H8" fill="none" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>

      <button id="winClose" class="win-btn win-close" aria-label="Close" title="Close">
        <svg viewBox="0 0 12 12" aria-hidden="true">
          <line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.5" />
          <line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
    </div>
  </div>

  <div id="container">
    <!-- Contenedor principal de la aplicación -->

    <div id="left">
      <!-- Columna izquierda: controles y temporizador -->

      <div class="bg-sun" aria-hidden="true"></div>
      <!-- Sol retrowave de fondo -->

      <div class="bg-grid" aria-hidden="true"></div>
      <!-- Rejilla de horizonte de fondo -->

      <div class="crt-overlay" aria-hidden="true"></div>
      <!-- Overlay CRT (solo en el panel izquierdo): scanlines y viñeta -->

      <div class="left-content">
        <h1>FocusDeck</h1>
        <!-- Título principal -->

        <div id="settings">
          <!-- Contenedor de configuraciones -->

          <div class="labelsInputs">
            <label for="hoursSelect">Hours</label>
            <input type="number" id="hoursSelect" min="1" max="8" value="1" />
            <!-- Input para definir las horas totales de la sesión Pomodoro (entre 1 y 8) -->
          </div>

          <div class="labelsInputs">
            <label for="workDuration">Deep Work</label>
            <input type="number" id="workDuration" min="1" max="90" value="25" />
            <!-- Input para duración del tiempo de trabajo (entre 1 y 90 minutos) -->
          </div>

          <div class="labelsInputs">
            <label for="breakDuration">Break Time</label>
            <input type="number" id="breakDuration" min="1" max="30" value="5" />
            <!-- Input para duración del descanso (entre 1 y 30 minutos) -->
          </div>

          <button id="setTimeBtn">Apply</button>
          <!-- Botón para aplicar los valores ingresados -->
        </div>

        <section>
          <p>
            <span id="cycleCounter">Cycles completed: 0</span><br>
            <!-- Muestra la cantidad de ciclos completados -->

            <span id="cycleTotal">Total cycles: 0</span>
            <!-- Muestra la cantidad total de ciclos programados -->
          </p>

          <div id="progressBarContainer">
            <!-- Contenedor de la barra de progreso visual -->
            <div id="progressBar"></div>
            <!-- Barra que se va llenando a medida que se completan ciclos -->
          </div>
        </section>

        <div id="timerBlock">
          <span id="modeLabel" class="work">DEEP WORK</span>
          <!-- Indicador del modo actual: trabajo / descanso / sesión completa -->

          <div id="timer">25:00</div>
          <!-- Temporizador que muestra el tiempo restante actual -->
        </div>

        <div id="buttons">
          <!-- Botones de control para el temporizador -->
          <button id="startBtn">Start</button>
          <!-- Starts the timer -->

          <button id="pauseBtn">Pause</button>
          <!-- Pauses the timer -->

          <button id="resetBtn">Reset</button>
          <!-- Resets the timer and settings -->
          <!-- Reinicia el temporizador y la configuración -->
        </div>
      </div>
    </div>

    <div id="right">
      <!-- Columna derecha: vista web embebida -->
      <webview id="youtube" src="https://www.youtube.com" allowpopups></webview>

      <button id="cinemaBtn">🎬</button>
      <!-- <webview src="https://www.youtube.com" allowpopups></webview> -->
      <!-- WebView de Electron para mostrar YouTube dentro de la app -->
    </div>
  </div>

  <audio id="clickSound" src="click.mp3" preload="auto"></audio>
  <!-- Sonido que se reproduce al hacer clic en un botón -->

  <audio id="alertSound" src="click.mp3" preload="auto"></audio>
  <!-- Sonido de alerta al cambiar entre trabajo y descanso -->

  <div id="toast" aria-live="polite"></div>
  <!-- Notificación no bloqueante (reemplaza a los alert() ) -->

  <script src="renderer.js"></script>
  <!-- Enlace al script principal que maneja la lógica de la app -->
</body>

</html>
